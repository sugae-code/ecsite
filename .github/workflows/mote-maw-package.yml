name: Build Mote and Maw portal submission
on:
  workflow_dispatch:
  push:
    paths:
      - 'games/mote-and-maw/**'
      - '.github/workflows/mote-maw-package.yml'
permissions:
  contents: read
jobs:
  release-package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate original HTML5 game and CrazyGames SDK bridge
        run: |
          set -euo pipefail
          node --check games/mote-and-maw/game.mjs
          node --check games/mote-and-maw/engine.mjs
          node --check games/mote-and-maw/crazygames-bridge.mjs
          node --test games/mote-and-maw/engine.test.mjs games/mote-and-maw/crazygames-bridge.test.mjs
      - name: Render three required game cover sizes
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow==11.3.0
          python games/mote-and-maw/tools/build_covers.py
      - name: Make standalone root-index game ZIP and verify all local imports
        run: |
          python - <<'PY'
          import hashlib, re, shutil, zipfile
          from pathlib import Path
          from PIL import Image
          folder = Path("games/mote-and-maw")
          files = ["index.html", "style.css", "game.mjs", "engine.mjs", "crazygames-bridge.mjs"]
          for name in files:
              if not (folder/name).is_file():
                  raise RuntimeError("Missing required game module: " + name)
          for name in ["game.mjs", "engine.mjs", "crazygames-bridge.mjs"]:
              content=(folder/name).read_text(encoding="utf-8")
              for target in re.findall(r"\bfrom\s+['\"](\.[^'\"]+)['\"]",content):
                  source=(folder/name).parent
                  if not (source/target).is_file():
                      raise RuntimeError("Broken JavaScript import: "+name+" => "+target)
          dest=Path("artifacts")
          dest.mkdir(exist_ok=True)
          with zipfile.ZipFile(dest/"mote-and-maw-game.zip","w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for name in files:
                  z.write(folder/name,name)
          total=sum((folder/name).stat().st_size for name in files)
          if total>20*1024*1024:
              raise RuntimeError("Mobile home page initial download size exceeded 20MB")
          for name,dimensions in [("landscape.png",(1920,1080)),("portrait.png",(800,1200)),("square.png",(800,800))]:
              image=Image.open(folder/"covers"/name)
              if image.size != dimensions:
                  raise RuntimeError("Wrong cover size: "+name)
              shutil.copy2(folder/"covers"/name,dest/name)
          with (dest/"sha256sum.txt").open("w") as out:
              for path in sorted(dest.glob("*")):
                  out.write(hashlib.sha256(path.read_bytes()).hexdigest()+"  "+path.name+"\n")
          print("Game bundle",total,"bytes, 5 files, covers verified")
          PY
      - name: Upload no-account public build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mote-maw-game-and-covers
          path: artifacts/*
          if-no-files-found: error
          retention-days: 90

  preview-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install video capture dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow==11.3.0 playwright==1.55.0
          command -v ffmpeg
          command -v google-chrome
      - name: Record actual local gameplay in landscape and portrait
        run: python games/mote-and-maw/tools/make_preview.py
      - name: Publish video previews for official portal submission
        uses: actions/upload-artifact@v4
        with:
          name: mote-maw-gameplay-preview-videos
          path: |
            artifacts/preview-landscape.mp4
            artifacts/preview-portrait.mp4
          if-no-files-found: error
          retention-days: 90
