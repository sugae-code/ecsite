name: Test ORIGIN-1 Protocol
on:
  workflow_dispatch:
  push:
    paths:
      - 'origin-1/**'
      - '.github/workflows/origin-1-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test origin-1/origin-right.test.mjs
