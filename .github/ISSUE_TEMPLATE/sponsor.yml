name: "広告掲載・業務提携の相談"
description: "箱ぴたへの広告・梱包資材の提携相談（公開フォーム）"
title: "[提携相談] "
body:
  - type: markdown
    attributes:
      value: |
        箱ぴたは梱包サイズを無料で計算するサイトです。
        このフォームは公開GitHub Issueになります。氏名・個人の連絡先・口座情報・契約上の秘密・広告の秘密URLなどは絶対に投稿しないでください。
        投稿だけでは広告掲載契約・料金請求は成立しません。アクセス数や成果は保証しません。
  - type: input
    id: business
    attributes:
      label: 事業者名・サイトURL
      placeholder: "公開可能な会社名と公式サイトURL"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 提携内容
      options:
        - "梱包資材・段ボールの広告掲載"
        - "業務提携・紹介プログラム"
        - "商品・サービスの紹介"
        - "その他"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 掲載したい内容と希望条件
      description: "公開可能な説明のみ。予算や希望期間も任意"
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 確認
      options:
        - label: "投稿内容が公開され、これだけで契約は成立しないことを理解しました"
          required: true
